name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project NavidromeMusicSync.xcodeproj \
            -scheme NavidromeMusicSync \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NavidromeMusicSync.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/NavidromeMusicSync-unsigned.ipa" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/NavidromeMusicSync-unsigned.ipa" | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NavidromeMusicSync-unsigned
          path: NavidromeMusicSync-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
