name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: navidrome-music-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Build idevice FFI for iOS
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jkcoxson/idevice.git "$RUNNER_TEMP/idevice"
          cd "$RUNNER_TEMP/idevice/ffi"
          RUSTFLAGS="-C link-arg=-miphoneos-version-min=16.0" \
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          cargo build --release --target aarch64-apple-ios --features obfuscate
          mkdir -p "$GITHUB_WORKSPACE/Vendor/idevice"
          cp idevice.h "$GITHUB_WORKSPACE/Vendor/idevice/idevice.h"
          cp "$RUNNER_TEMP/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a" \
             "$GITHUB_WORKSPACE/Vendor/idevice/libidevice_ffi.a"
          file "$GITHUB_WORKSPACE/Vendor/idevice/libidevice_ffi.a"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project NavidromeMusicSync.xcodeproj \
            -scheme NavidromeMusicSync \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NavidromeMusicSync.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/NavidromeMusicSync-unsigned.ipa" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/NavidromeMusicSync-unsigned.ipa" | head -40

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavidromeMusicSync-unsigned
          path: NavidromeMusicSync-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct latest IPA download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete navi-test-latest --cleanup-tag -y || true
          gh release create navi-test-latest \
            NavidromeMusicSync-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "Latest Navi Music Sync test IPA" \
            --notes "Automated unsigned test build from commit $GITHUB_SHA. Download the .ipa asset directly for SideStore." \
            --prerelease

      - name: Upload idevice FFI diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: idevice-ffi-ios
          path: |
            Vendor/idevice/idevice.h
            Vendor/idevice/libidevice_ffi.a
          if-no-files-found: error
          retention-days: 7
